# CustomConfigMap configuration
customConfigMap:
  # Name of the CustomConfigMap resource
  name: example-config

  # Data to be stored in the CustomConfigMap
  data:
    database.host: "localhost"
    database.port: "5432"
    database.name: "myapp"
    app.env: "development"
    log.level: "info"

# Metadata labels and annotations
metadata:
  labels: {}
  annotations: {}

# Namespace (if not specified, uses release namespace)
namespace: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""
