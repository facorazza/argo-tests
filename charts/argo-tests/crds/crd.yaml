apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: customconfigmaps.config.example.com
  labels:
    app.kubernetes.io/name: custom-configmap
    app.kubernetes.io/version: "1.0.0"
spec:
  group: config.example.com
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              data:
                type: object
                additionalProperties:
                  type: string
                description: "Key-value pairs of configuration data"
          status:
            type: object
            properties:
              phase:
                type: string
                enum:
                - "Active"
                - "Failed"
                default: "Active"
                description: "The phase of the CustomConfigMap"
              lastUpdated:
                type: string
                format: date-time
                description: "Last time the CustomConfigMap was updated"
              dataHash:
                type: string
                description: "Hash of the data for change detection"
            description: "CustomConfigMap status"
        required:
        - spec
    additionalPrinterColumns:
    - name: Age
      type: date
      jsonPath: ".metadata.creationTimestamp"
    - name: Phase
      type: string
      jsonPath: ".status.phase"
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: customconfigmaps
    singular: customconfigmap
    kind: CustomConfigMap
    shortNames:
    - ccm
    categories:
    - all
